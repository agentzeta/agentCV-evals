<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Assessment report viewer</title><style>body{max-width:1000px;margin:50px auto;background:#101b2b;color:#e8edf5;font:17px system-ui;padding:24px}h1{color:#72d9c0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#18283b;padding:24px;border-radius:12px}input{margin:20px 0}</style><h1>Assessment report viewer</h1><p>Open a locally generated JSON report. The file stays in this browser; there are no network calls. Results reflect the evidence supplied, not independent certification.</p><input type="file" accept=".json" id="file"><pre id="report">Choose a report.</pre><script>document.getElementById('file').addEventListener('change',async e=>{try{const d=JSON.parse(await e.target.files[0].text());document.getElementById('report').textContent=JSON.stringify(d,null,2)}catch(x){document.getElementById('report').textContent='Invalid JSON report'}})</script>
